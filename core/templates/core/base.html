{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portfolio{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233D5A99'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='700' font-family='Inter%2C sans-serif'%3ERD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">RD.</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/#skills">Skills</a></li>
        <li><a href="/projects/">Projects</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
      <div class="nav-right">
        <button id="themeToggle" aria-label="Toggle theme"><i class="bi bi-moon-fill"></i></button>
        <button id="hamburger" aria-label="Open menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <div class="footer-inner">
      <p class="footer-copy">&copy; 2026 {% block footer_name %}Portfolio{% endblock %}. All rights reserved.</p>
    </div>
  </footer>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
